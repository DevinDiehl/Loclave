<svg width="512" height="512" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2440"/>
      <stop offset="100%" stop-color="#0f1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- double-loop shackle: two interlocking arcs = "in lockstep" -->
  <path d="M 34 46 L 34 34 A 12 12 0 0 1 50 23" fill="none" stroke="url(#accent)" stroke-width="6.5" stroke-linecap="round"/>
  <path d="M 50 23 A 12 12 0 0 1 66 34 L 66 46" fill="none" stroke="#e2e8f0" stroke-width="6.5" stroke-linecap="round"/>

  <!-- lock body -->
  <rect x="26" y="44" width="48" height="34" rx="9" fill="url(#accent)"/>

  <!-- keyhole -->
  <circle cx="50" cy="58" r="5" fill="#0f1626"/>
  <rect x="47.5" y="60" width="5" height="9" rx="1.5" fill="#0f1626"/>
</svg>
